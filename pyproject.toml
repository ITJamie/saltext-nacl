[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "saltext.nacl"
description = "Self-contained NaCl encrypted-secrets extension for Salt 3008"
authors = [{name = "Jamie (Bear) Murphy", email = "git@jam.ie"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["PyNaCl>=1.6.2"]
keywords = ["salt-extension", "nacl", "encryption"]
classifiers = ["Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Operating System :: OS Independent", "Development Status :: 4 - Beta"]

[project.urls]
Homepage = "https://github.com/ITJamie/saltext-nacl"
Documentation = "https://itjamie.github.io/saltext-nacl/"
Source = "https://github.com/ITJamie/saltext-nacl"
Issues = "https://github.com/ITJamie/saltext-nacl/issues"

[project.optional-dependencies]
salt = ["salt>=3008,<3009"]
tests = ["pytest>=8.4,<9", "pytest-salt-factories>=1.0.5", "coverage>=7.10", "PyYAML", "Jinja2", "msgpack", "looseversion", "packaging", "requests", "tornado", "pyzmq", "psutil", "distro", "python-dateutil", "pycryptodomex", "setproctitle", "xxhash", "pywin32; sys_platform=='win32'", "wmi; sys_platform=='win32'"]
docs = ["sphinx>=7", "furo", "myst-parser"]
dev = ["nox>=2024.3", "build", "twine", "ruff>=0.14", "bandit>=1.8", "towncrier>=25", "pre-commit>=4"]

[project.entry-points."salt.loader"]
"saltext.nacl" = "saltext.nacl"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:'crypt' is deprecated:DeprecationWarning", "ignore:pkg_resources is deprecated:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F821"] # Salt injects loader globals at runtime.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "F841"]

[tool.towncrier]
name = "saltext.nacl"
filename = "CHANGELOG.md"
directory = "changelog"
start_string = "# Changelog\n"
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/ITJamie/saltext-nacl/issues/{issue})"
[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true
[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true
[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true
