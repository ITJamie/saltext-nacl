repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-yaml
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: ruff format --check .
        language: system
        pass_filenames: false
