name: Prepare release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version without v (preparation only; no tag or publication)'
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python -c 'import os,re; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", os.environ["RELEASE_VERSION"]), "Invalid SemVer"'
      - run: python -m pip install towncrier
      - name: Build changelog and open release PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          branch="release/$RELEASE_VERSION"
          git switch -c "$branch"
          towncrier build --yes --version "$RELEASE_VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md changelog
          git commit -m "Prepare $RELEASE_VERSION changelog"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Prepare $RELEASE_VERSION" --body 'Review the changelog and run CI before merging. This PR does not tag or publish a release.'
