name: Publish package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Previously reviewed vMAJOR.MINOR.PATCH tag; publishing must also be enabled'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    if: vars.ENABLE_PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag is a reviewed main commit with a rendered changelog
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" origin/main
          git checkout --detach "refs/tags/$RELEASE_TAG^{commit}"
          grep -Fq "## ${RELEASE_TAG#v} (" CHANGELOG.md
          test -z "$(find changelog -type f -name '*.md' -print -quit)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-deps salt==3008.5
      - run: python -m pip install -e ".[tests,dev]"
      - run: python tools/test.py
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check distribution version matches requested tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -c 'import glob,os; from packaging.utils import parse_wheel_filename; assert str(parse_wheel_filename(glob.glob("dist/*.whl")[0])[1]) == os.environ["RELEASE_TAG"][1:]'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-distributions
          path: dist/*
  publish:
    needs: build
    if: vars.ENABLE_PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-distributions
          path: dist
      - name: Validate selected package index
        env:
          PUBLISH_INDEX: ${{ vars.PUBLISH_INDEX }}
        run: test "$PUBLISH_INDEX" = testpypi || test "$PUBLISH_INDEX" = pypi
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        if: vars.PUBLISH_INDEX == 'testpypi'
        with:
          repository-url: https://test.pypi.org/legacy/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        if: vars.PUBLISH_INDEX == 'pypi'
