name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Salt 3008.5 / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - {os: windows-latest, python: '3.10'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-latest, python: '3.10'}
          - {os: macos-latest, python: '3.14'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-deps salt==3008.5
      - run: python -m pip install -e ".[tests]"
      - run: python tools/test.py -vv --junitxml=artifacts/junit.xml --log-file=artifacts/pytest.log --log-file-level=DEBUG --durations=10
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            artifacts/
          if-no-files-found: error
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-deps salt==3008.5
      - run: python -m pip install -e ".[tests,docs,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: bandit -q -r src
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test the installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          wheel_python="$RUNNER_TEMP/wheel-env/bin/python"
          "$wheel_python" -m pip install --no-deps salt==3008.5
          "$wheel_python" -m pip install "$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)[tests]"
          cd "$RUNNER_TEMP"
          "$wheel_python" "$GITHUB_WORKSPACE/tools/wheel_smoke.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: html-documentation
          path: docs/_build/html
